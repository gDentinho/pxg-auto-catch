name: Release Windows build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build package
        shell: pwsh
        run: ./build_ci.ps1

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./dist/PxGAutoCatch-v*-win-x64.zip | Select-Object -First 1
          if (-not $zip) { throw "Release ZIP não encontrado." }
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "sha=$($zip.FullName).sha256" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.sha }}
